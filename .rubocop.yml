plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-capybara
  - rubocop-rspec_rails
  - rubocop-factory_bot

Style/Documentation:
  Enabled: false

AllCops:
  Exclude:
    - 'db/schema.rb'
    - 'db/migrate/*'
    - 'bin/*'

Metrics/MethodLength:
  Max: 15  # Methods longer than 15 lines get a warning


RSpec/MultipleMemoizedHelpers:
  Enabled: false
    
Metrics/BlockLength:
    Exclude:
      - 'config/routes.rb'
      - 'config/environments/*'
      - 'Rakefile'
      - '**/*.rake'
      - 'spec/**/*.rb'

Rails/UnknownEnv:
  Environments:
    - production
    - development
    - test
    - staging
    - preview
